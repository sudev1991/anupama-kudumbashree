<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anupama Kudumbashree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background-color: #f1f5f9; margin: 0; }
        .nav-active { background-color: #2563eb; color: white; transform: translateY(-3px); }
        .animate-fade { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [view, setView] = useState('home');
            const [data, setData] = useState({ members: [], transactions: [] });
            const [loading, setLoading] = useState(true);
            const [showSearch, setShowSearch] = useState(false);
            const [searchFilters, setSearchFilters] = useState({ name: '', month: '', date: '' });
            const [formData, setFormData] = useState({ memberId: '', type: 'investment', amount: '' });

            const SHEET_URL = "https://script.google.com/macros/s/AKfycbyKIF-gsKyxHeEhOYsBAWyWx2EuoqjjJ1yyr7oXHEaLUFDUpvcSb2i3Go65WYq4QByBsA/exec";

            useEffect(() => { fetchData(); }, []);

            const fetchData = () => {
                setLoading(true);
                fetch(SHEET_URL).then(res => res.json()).then(json => {
                    setData({ 
                        members: (json.members || []).map(m => ({ id: m.id || m.ID, name: m.name || m.Name, initialLoan: Number(m.initialLoan || 0) })), 
                        transactions: json.transactions || [] 
                    });
                    setLoading(false);
                }).catch(() => setLoading(false));
            };

            // Filter Logic for Advanced Search
            const filteredTransactions = useMemo(() => {
                return data.transactions.filter(t => {
                    const m = data.members.find(mem => mem.id == t.memberId);
                    const matchName = !searchFilters.name || (m && m.name.includes(searchFilters.name));
                    const matchMonth = !searchFilters.month || (t.date && t.date.includes(searchFilters.month));
                    const matchDate = !searchFilters.date || (t.date && t.date.split('T')[0] === searchFilters.date);
                    return matchName && matchMonth && matchDate;
                }).reverse();
            }, [data, searchFilters]);

            const handleDelete = async (txId) => {
                if(!confirm("ഈ എൻട്രി ഡിലീറ്റ് ചെയ്യണോ?")) return;
                setLoading(true);
                await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'delete', id: txId })});
                fetchData();
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ ...formData, amount: Number(formData.amount), date: new Date().toISOString() })});
                setFormData({ memberId: '', type: 'investment', amount: '' });
                fetchData();
            };

            if (loading) return <div className="flex h-screen items-center justify-center font-bold text-blue-600">Syncing...</div>;

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col relative pb-20 shadow-2xl">
                    <header className="bg-blue-600 p-6 text-white rounded-b-[2.5rem] flex justify-between items-center shadow-lg">
                        <h1 className="text-2xl font-black">അനുപമ</h1>
                        <button onClick={() => setShowSearch(!showSearch)} className="bg-white/20 p-2 rounded-full">🔍</button>
                    </header>

                    <main className="p-4 flex-1 overflow-y-auto">
                        {/* Advanced Search Panel */}
                        {showSearch && (
                            <div className="bg-slate-100 p-4 rounded-3xl mb-6 animate-fade space-y-3">
                                <input placeholder="അംഗത്തിന്റെ പേര്" className="w-full p-2 rounded-xl border-none text-sm" onChange={e => setSearchFilters({...searchFilters, name: e.target.value})} />
                                <div className="flex gap-2">
                                    <input type="month" className="w-1/2 p-2 rounded-xl border-none text-sm" onChange={e => setSearchFilters({...searchFilters, month: e.target.value})} />
                                    <input type="date" className="w-1/2 p-2 rounded-xl border-none text-sm" onChange={e => setSearchFilters({...searchFilters, date: e.target.value})} />
                                </div>
                            </div>
                        )}

                        {view === 'home' && (
                            <div className="space-y-4">
                                <div className="bg-slate-900 p-6 rounded-3xl text-white">
                                    <p className="text-[10px] uppercase opacity-50 font-bold">ആകെ വായ്പ ബാക്കി</p>
                                    <p className="text-3xl font-black">₹{data.members.reduce((a,b)=>a+b.initialLoan, 0).toLocaleString()}</p>
                                </div>
                                {data.members.map((m, i) => (
                                    <div key={i} className="bg-slate-50 p-4 rounded-2xl flex justify-between border border-slate-100">
                                        <span className="font-bold">{m.name}</span>
                                        <span className="font-black text-blue-600">₹{m.initialLoan}</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'transactions' && (
                            <div className="space-y-6">
                                <form onSubmit={handleSubmit} className="bg-blue-50 p-5 rounded-3xl space-y-3">
                                    <select className="w-full p-3 rounded-xl border-none font-bold" value={formData.memberId} onChange={e => setFormData({...formData, memberId: e.target.value})}>
                                        <option value="">അംഗത്തെ തിരഞ്ഞെടുക്കുക</option>
                                        {data.members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                    </select>
                                    <select className="w-full p-3 rounded-xl border-none font-bold" value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})}>
                                        <option value="investment">സമ്പാദ്യം</option>
                                        <option value="loanTaken">വായ്പ എടുക്കൽ</option>
                                        <option value="loanRepaid">തിരിച്ചടവ്</option>
                                    </select>
                                    <input type="number" placeholder="തുക" className="w-full p-3 rounded-xl border-none font-bold" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} />
                                    <button className="w-full bg-blue-600 text-white p-4 rounded-xl font-black">സേവ് ചെയ്യുക</button>
                                </form>

                                <div>
                                    <h3 className="font-black text-slate-800 mb-3 ml-2">സമീപകാല എൻട്രികൾ (Last 25)</h3>
                                    <div className="space-y-2">
                                        {filteredTransactions.slice(0, 25).map((t, i) => (
                                            <div key={i} className="bg-white p-3 rounded-xl border flex justify-between items-center text-sm shadow-sm">
                                                <div>
                                                    <p className="font-bold">{data.members.find(m => m.id == t.memberId)?.name}</p>
                                                    <p className="text-[10px] text-slate-400">{new Date(t.date).toLocaleDateString()}</p>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="text-right">
                                                        <p className="font-black text-blue-600">₹{t.investment || t.loanTaken || t.loanRepaid}</p>
                                                        <p className="text-[8px] uppercase font-bold opacity-40">{t.investment ? 'Saving' : 'Loan'}</p>
                                                    </div>
                                                    <button onClick={() => handleDelete(t.id)} className="text-red-400 p-2">🗑️</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-4 flex justify-around shadow-inner z-50">
                        <button onClick={() => setView('home')} className={`px-6 py-2 rounded-xl text-[10px] font-bold ${view === 'home' ? 'nav-active' : 'text-slate-400'}`}>HOME</button>
                        <button onClick={() => setView('transactions')} className={`px-6 py-2 rounded-xl text-[10px] font-bold ${view === 'transactions' ? 'nav-active' : 'text-slate-400'}`}>ENTRY</button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
