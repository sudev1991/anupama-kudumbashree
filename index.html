<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anupama Kudumbashree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background-color: #f8fafc; margin: 0; }
        .nav-active { background-color: #2563eb; color: white; transform: translateY(-5px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [view, setView] = useState('home');
            const [data, setData] = useState({ members: [], transactions: [] });
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);
            const [formData, setFormData] = useState({ memberId: '', type: 'investment', amount: '' });

            const SHEET_URL = "https://script.google.com/macros/s/AKfycbyKIF-gsKyxHeEhOYsBAWyWx2EuoqjjJ1yyr7oXHEaLUFDUpvcSb2i3Go65WYq4QByBsA/exec";

            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = () => {
                setLoading(true);
                fetch(SHEET_URL)
                    .then(res => res.json())
                    .then(json => {
                        const members = (json.members || []).map(m => ({
                            id: m.id || m.ID || '',
                            name: m.name || m.Name || 'Unknown',
                            initialLoan: Number(m.initialLoan || m['Initial Loan'] || 0)
                        }));
                        setData({ members: members, transactions: json.transactions || [] });
                        setLoading(false);
                    })
                    .catch(err => { console.error(err); setLoading(false); });
            };

            const stats = useMemo(() => {
                let totalInv = 0, totalLoanTaken = 0, totalLoanRepaid = 0;
                data.transactions.forEach(t => {
                    totalInv += Number(t.investment || t.Investment || 0);
                    totalLoanTaken += Number(t.loanTaken || t['Loan Taken'] || 0);
                    totalLoanRepaid += Number(t.loanRepaid || t['Loan Repaid'] || 0);
                });
                const initialTotal = data.members.reduce((acc, m) => acc + m.initialLoan, 0);
                return { totalInv, balance: initialTotal + (totalLoanTaken - totalLoanRepaid), repaid: totalLoanRepaid };
            }, [data]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.memberId || !formData.amount) return alert("ദയവായി വിവരങ്ങൾ നൽകുക");
                
                setSubmitting(true);
                try {
                    await fetch(SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ ...formData, amount: Number(formData.amount), date: new Date().toISOString() })
                    });
                    setFormData({ memberId: '', type: 'investment', amount: '' });
                    alert("വിവരങ്ങൾ വിജയകരമായി അയച്ചു!");
                    fetchData(); // Refresh data immediately
                } catch (err) {
                    alert("Error saving data");
                } finally {
                    setSubmitting(false);
                }
            };

            if (loading) return <div className="flex h-screen items-center justify-center font-bold text-blue-600 animate-pulse">അനുപമ ലോഡിംഗ്...</div>;

            return (
                <div className="max-w-md mx-auto bg-slate-50 min-h-screen flex flex-col relative pb-24">
                    <header className="bg-blue-600 p-8 text-white rounded-b-[2.5rem] shadow-lg">
                        <div className="flex justify-between items-start">
                            <div>
                                <h1 className="text-3xl font-black tracking-tight">അനുപമ</h1>
                                <p className="text-xs font-bold opacity-70 mt-1 uppercase tracking-widest">{view}</p>
                            </div>
                            <button onClick={fetchData} className="bg-white/20 p-2 rounded-full active:rotate-180 transition-transform">🔄</button>
                        </div>
                    </header>

                    <main className="p-5 overflow-y-auto">
                        {view === 'home' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <div className="bg-slate-900 p-6 rounded-[2rem] text-white card-shadow">
                                    <p className="text-[10px] uppercase font-bold opacity-50">ആകെ ബാക്കി നിൽക്കുന്ന വായ്പ</p>
                                    <p className="text-3xl font-black mt-1">₹{stats.balance.toLocaleString()}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-white p-4 rounded-2xl border border-slate-100 card-shadow">
                                        <p className="text-[9px] font-bold text-slate-400 uppercase">സമ്പാദ്യം</p>
                                        <p className="text-lg font-black text-blue-600">₹{stats.totalInv.toLocaleString()}</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl border border-slate-100 card-shadow">
                                        <p className="text-[9px] font-bold text-slate-400 uppercase">തിരിച്ചടവ്</p>
                                        <p className="text-lg font-black text-emerald-600">₹{stats.repaid.toLocaleString()}</p>
                                    </div>
                                </div>
                                <h3 className="font-black text-slate-800 mt-4">അംഗങ്ങളുടെ ലിസ്റ്റ്</h3>
                                <div className="space-y-2">
                                    {data.members.map((m, i) => (
                                        <div key={i} className="bg-white p-4 rounded-2xl flex justify-between items-center card-shadow border border-slate-50">
                                            <span className="font-bold text-slate-700">{m.name}</span>
                                            <span className="font-black text-blue-600 text-sm">₹{m.initialLoan}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'transactions' && (
                            <div className="animate-in slide-in-from-bottom-4 duration-300">
                                <h2 className="font-black text-xl mb-4 ml-2">പുതിയ ഇടപാട്</h2>
                                <form onSubmit={handleSubmit} className="space-y-4 bg-white p-6 rounded-[2rem] card-shadow border border-slate-100">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 ml-2">അംഗം</label>
                                        <select className="w-full p-4 rounded-2xl bg-slate-50 border-none font-bold mt-1 text-slate-700" value={formData.memberId} onChange={(e) => setFormData({...formData, memberId: e.target.value})}>
                                            <option value="">തിരഞ്ഞെടുക്കുക</option>
                                            {data.members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 ml-2">ഇനം</label>
                                        <select className="w-full p-4 rounded-2xl bg-slate-50 border-none font-bold mt-1 text-slate-700" value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})}>
                                            <option value="investment">സമ്പാദ്യം</option>
                                            <option value="loanTaken">വായ്പ എടുക്കൽ</option>
                                            <option value="loanRepaid">തിരിച്ചടവ്</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 ml-2">തുക</label>
                                        <input type="number" className="w-full p-4 rounded-2xl bg-slate-50 border-none font-bold mt-1" placeholder="₹ 0.00" value={formData.amount} onChange={(e) => setFormData({...formData, amount: e.target.value})} />
                                    </div>
                                    <button type="submit" disabled={submitting} className={`w-full ${submitting ? 'bg-slate-300' : 'bg-blue-600'} text-white font-black p-5 rounded-2xl shadow-lg active:scale-95 transition-all`}>
                                        {submitting ? 'അയക്കുന്നു...' : 'സേവ് ചെയ്യുക'}
                                    </button>
                                </form>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="space-y-6 animate-in fade-in">
                                <h2 className="font-black text-xl ml-2">ഹിസ്റ്ററി (History)</h2>
                                <div className="space-y-3">
                                    {data.transactions.slice().reverse().slice(0, 15).map((t, i) => {
                                        const m = data.members.find(mem => mem.id == t.memberId);
                                        const amt = t.investment || t.loanTaken || t.loanRepaid || 0;
                                        return (
                                            <div key={i} className="bg-white p-4 rounded-2xl flex justify-between items-center card-shadow border-l-4 border-l-blue-500">
                                                <div>
                                                    <p className="font-bold text-slate-800 text-sm">{m ? m.name : 'Unknown'}</p>
                                                    <p className="text-[9px] text-slate-400 font-bold">{new Date(t.date).toLocaleDateString()}</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="font-black text-blue-600">₹{amt}</p>
                                                    <p className="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">
                                                        {t.investment ? 'Saving' : (t.loanTaken ? 'Loan' : 'Repaid')}
                                                    </p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-md border-t border-slate-100 p-4 flex justify-around items-center z-50">
                        <button onClick={() => setView('home')} className={`px-5 py-3 rounded-2xl text-[10px] font-black transition-all ${view === 'home' ? 'nav-active' : 'text-slate-400'}`}>HOME</button>
                        <button onClick={() => setView('transactions')} className={`px-5 py-3 rounded-2xl text-[10px] font-black transition-all ${view === 'transactions' ? 'nav-active' : 'text-slate-400'}`}>ENTRY</button>
                        <button onClick={() => setView('reports')} className={`px-5 py-3 rounded-2xl text-[10px] font-black transition-all ${view === 'reports' ? 'nav-active' : 'text-slate-400'}`}>HISTORY</button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
