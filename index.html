<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anupama Kudumbashree</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel (Required for single-file JSX) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; margin: 0; padding: 0; background-color: #f1f5f9; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; height: 100vh; align-items: center; justify-content: center; flex-direction: column;">
            <div style="border: 4px solid #2563eb; border-top: 4px solid transparent; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
            <p style="margin-top: 16px; font-weight: bold; color: #475569;">ലോഡിംഗ്...</p>
        </div>
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Simple Icon Wrapper
        const Icon = ({ name, size = 24, className = "" }) => {
            const LucideIcon = lucide[name.charAt(0).toUpperCase() + name.slice(1)];
            return LucideIcon ? <LucideIcon size={size} className={className} /> : null;
        };

        const App = () => {
            const [data, setData] = useState({ members: [], transactions: [] });
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const SHEET_URL = "https://script.google.com/macros/s/AKfycbyKIF-gsKyxHeEhOYsBAWyWx2EuoqjjJ1yyr7oXHEaLUFDUpvcSb2i3Go65WYq4QByBsA/exec";

            useEffect(() => {
                console.log("Fetching data...");
                fetch(SHEET_URL)
                    .then(res => res.json())
                    .then(json => {
                        console.log("Data received:", json);
                        setData({
                            members: json.members || [],
                            transactions: json.transactions || []
                        });
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Fetch error:", err);
                        setError("ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു.");
                        setLoading(false);
                    });
            }, []);

            if (loading) return (
                <div className="flex flex-col items-center justify-center h-screen">
                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                    <p className="mt-4 font-bold text-slate-600 text-lg">സിങ്ക് ചെയ്യുന്നു...</p>
                </div>
            );

            if (error) return (
                <div className="p-10 text-center">
                    <div className="text-red-500 mb-4 font-black">X</div>
                    <p className="font-bold">{error}</p>
                    <button onClick={() => window.location.reload()} className="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg">Retry</button>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col">
                    <header className="bg-blue-600 p-6 text-white rounded-b-[2rem] shadow-lg">
                        <h1 className="text-2xl font-black">അനുപമ കുടുംബശ്രീ</h1>
                        <p className="text-xs opacity-80 uppercase font-bold mt-1">ഡാഷ്‌ബോർഡ്</p>
                    </header>

                    <main className="flex-1 p-5">
                        <div className="grid grid-cols-1 gap-4">
                            {data.members.length === 0 ? (
                                <p className="text-center text-slate-400 mt-10">അംഗങ്ങൾ ആരും തന്നെയില്ല.</p>
                            ) : (
                                data.members.map(m => (
                                    <div key={m.id || m.ID} className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                        <div>
                                            <p className="font-bold text-slate-800">{m.name || m.Name}</p>
                                            <p className="text-[10px] text-blue-600 font-bold">അംഗം ID: {m.id || m.ID}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="font-black">₹{m.initialLoan || 0}</p>
                                            <p className="text-[9px] text-slate-400 uppercase font-bold">വായ്പ ബാക്കി</p>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </main>
                    
                    <footer className="p-4 border-t text-center text-[10px] text-slate-300 font-bold">
                        ANUPAMA TRACKER v1.0
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
