<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anupama Kudumbashree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const LucideIcon = lucide[name.charAt(0).toUpperCase() + name.slice(1)];
            return LucideIcon ? <LucideIcon size={size} className={className} /> : null;
        };

        const App = () => {
            const [view, setView] = useState('home'); 
            const [data, setData] = useState({ members: [], transactions: [] });
            const [loading, setLoading] = useState(true);

            const SHEET_URL = "https://script.google.com/macros/s/AKfycbyKIF-gsKyxHeEhOYsBAWyWx2EuoqjjJ1yyr7oXHEaLUFDUpvcSb2i3Go65WYq4QByBsA/exec";

            useEffect(() => {
                fetch(SHEET_URL).then(res => res.json()).then(json => {
                    setData({ members: json.members || [], transactions: json.transactions || [] });
                    setLoading(false);
                });
            }, []);

            if (loading) return (
                <div className="flex h-screen items-center justify-center">
                    <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative">
                    {/* Header */}
                    <header className="bg-blue-600 p-6 text-white rounded-b-[2.5rem] shadow-lg">
                        <h1 className="text-2xl font-black">അനുപമ</h1>
                        <p className="text-xs font-bold opacity-80">{view === 'home' ? 'ഡാഷ്‌ബോർഡ്' : view.toUpperCase()}</p>
                    </header>

                    {/* Main Content Areas */}
                    <main className="flex-1 p-5 pb-24">
                        {view === 'home' && (
                            <div className="space-y-4">
                                <div className="bg-slate-800 p-5 rounded-3xl text-white">
                                    <p className="text-[10px] uppercase font-bold opacity-60">ആകെ ബാക്കി വായ്പ</p>
                                    <p className="text-3xl font-black mt-1">₹{data.members.reduce((acc, m) => acc + Number(m.initialLoan || 0), 0).toLocaleString()}</p>
                                </div>
                                <h2 className="font-black text-slate-800 px-2 mt-6">അംഗങ്ങൾ</h2>
                                {data.members.map(m => (
                                    <div key={m.id} className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                        <span className="font-bold">{m.name}</span>
                                        <span className="font-black text-blue-600">₹{m.initialLoan}</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'transactions' && (
                            <div className="animate-in fade-in">
                                <h2 className="font-black text-xl mb-4">Transactions</h2>
                                <div className="bg-blue-50 p-4 rounded-2xl text-blue-700 text-sm font-bold border border-blue-100 mb-4">
                                   പുതിയ കണക്കുകൾ ചേർക്കാൻ അഡ്മിൻ ലോഗിൻ ചെയ്യുക.
                                </div>
                                <p className="text-slate-400 text-center py-10">No recent transactions found.</p>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="animate-in fade-in">
                                <h2 className="font-black text-xl mb-4">റിപ്പോർട്ടുകൾ</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                        <p className="text-[10px] font-bold text-slate-400">സമ്പാദ്യം</p>
                                        <p className="text-lg font-black text-blue-600">₹0</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                        <p className="text-[10px] font-bold text-slate-400">പലിശ</p>
                                        <p className="text-lg font-black text-emerald-600">₹0</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Navigation Bar */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-md border-t border-slate-100 p-4 flex justify-around items-center">
                        <button onClick={() => setView('home')} className={`p-3 rounded-2xl ${view === 'home' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>
                            <Icon name="home" />
                        </button>
                        <button onClick={() => setView('transactions')} className={`p-3 rounded-2xl ${view === 'transactions' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>
                            <Icon name="database" />
                        </button>
                        <button onClick={() => setView('reports')} className={`p-3 rounded-2xl ${view === 'reports' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>
                            <Icon name="fileText" />
                        </button>
                        <button onClick={() => alert('Coming Soon!')} className="p-3 text-slate-400">
                            <Icon name="settings" />
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
