<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kudumbashree App</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">
<div id="root"></div>

<script type="text/babel">

const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbyu9KEMvBObP-u9dof7L2rbQgYb88ZSD0dguHP8qUvB4AUDHvXv_l39WcdiQ2Zm54FowQ/exec";

const getTodayString = () => new Date().toISOString().split('T')[0];
const getCurrentMonthKey = () => getTodayString().substring(0, 7);

const getWeekOfMonth = (dateStr) => {
  const d = new Date(dateStr).getDate();
  return Math.ceil(d / 7);
};

const isLateEntry = (date, enteredAt) => {
  return (new Date(enteredAt) - new Date(date)) / (1000*60*60*24) > 6;
};

function App() {

  const [members, setMembers] = React.useState([]);
  const [transactions, setTransactions] = React.useState([]);
  const [sheetUrl, setSheetUrl] = React.useState(DEFAULT_SHEET_URL);
  const [syncStatus, setSyncStatus] = React.useState("idle");
  const [isLoaded, setIsLoaded] = React.useState(false);
  const [isRemoteUpdate, setIsRemoteUpdate] = React.useState(false);

  // ✅ GROUPED TRANSACTIONS (performance fix)
  const txByMember = React.useMemo(() => {
    const map = {};
    transactions.forEach(t => {
      if (t.isDeleted) return;
      if (!map[t.memberId]) map[t.memberId] = [];
      map[t.memberId].push(t);
    });
    return map;
  }, [transactions]);

  // ✅ LOAD FROM SHEET (CORS SAFE)
  React.useEffect(() => {
    if (!sheetUrl) return;

    async function load() {
      try {
        setSyncStatus("syncing");

        const res = await fetch(sheetUrl, { method: "GET" });

        if (!res.ok) throw new Error("Fetch failed");

        const data = await res.json();

        setIsRemoteUpdate(true);

        setMembers(data.members || []);
        setTransactions(data.transactions || []);

        setSyncStatus("success");

      } catch (e) {
        console.error(e);
        setSyncStatus("error");
      } finally {
        setIsLoaded(true);
        setTimeout(()=>setSyncStatus("idle"),3000);
      }
    }

    load();
  }, [sheetUrl]);

  // ✅ SYNC TO SHEET
  const syncWithSheet = async () => {
    if (!sheetUrl) return;

    setSyncStatus("syncing");

    try {
      const res = await fetch(sheetUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ members, transactions })
      });

      const data = await res.json();

      if (data.status === "success") {
        setSyncStatus("success");
      } else {
        throw new Error();
      }

    } catch (e) {
      setSyncStatus("error");
    }

    setTimeout(()=>setSyncStatus("idle"),3000);
  };

  // ✅ AUTO SYNC FIXED
  React.useEffect(() => {
    if (!isLoaded || isRemoteUpdate) {
      setIsRemoteUpdate(false);
      return;
    }

    const t = setTimeout(syncWithSheet, 1500);
    return () => clearTimeout(t);

  }, [members, transactions]);

  // ✅ DASHBOARD (optimized)
  const dashboard = React.useMemo(() => {
    let total = 0;

    members.forEach(m => {
      (txByMember[m.id] || []).forEach(t => {
        total += Number(t.investment || 0);
      });
    });

    return total;
  }, [members, txByMember]);

  // ✅ ADD MEMBER
  const addMember = () => {
    const name = prompt("Enter name");
    if (!name) return;

    setMembers([...members, {
      id: crypto.randomUUID(),
      name
    }]);
  };

  // ✅ ADD TRANSACTION
  const addTx = () => {
    if (members.length === 0) return alert("Add member first");

    const m = members[0];

    setTransactions([...transactions, {
      id: crypto.randomUUID(),
      memberId: m.id,
      date: getTodayString(),
      enteredAt: getTodayString(),
      investment: Math.floor(Math.random()*100),
      isDeleted:false
    }]);
  };

  return (
    <div className="p-6 max-w-xl mx-auto">

      <h1 className="text-2xl font-bold mb-4">Kudumbashree App</h1>

      <div className="flex gap-2 mb-4">
        <button onClick={addMember} className="bg-blue-500 text-white px-4 py-2 rounded">Add Member</button>
        <button onClick={addTx} className="bg-green-500 text-white px-4 py-2 rounded">Add Tx</button>
      </div>

      <div className="mb-4">
        <p>Total Investment: ₹{dashboard}</p>
      </div>

      <div className="mb-4">
        Sync Status: {syncStatus}
      </div>

      <div className="bg-white p-4 rounded shadow">
        <h2 className="font-bold mb-2">Transactions</h2>
        {transactions.map(t => (
          <div key={t.id} className="border-b py-2">
            ₹{t.investment} ({t.date})
            {isLateEntry(t.date, t.enteredAt) && 
              <span className="text-red-500 ml-2">LATE</span>}
          </div>
        ))}
      </div>

      {/* ✅ MOBILE SCROLL FIX */}
      <div className="mt-6 text-xs text-gray-400">
        ← Swipe horizontally if table overflows →
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
