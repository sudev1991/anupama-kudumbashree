<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anupama Kudumbashree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background-color: #f8fafc; margin: 0; }
        .nav-active { background-color: #2563eb; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [view, setView] = useState('home');
            const [data, setData] = useState({ members: [], transactions: [] });
            const [loading, setLoading] = useState(true);
            const [formData, setFormData] = useState({ memberId: '', type: 'investment', amount: '' });
            const [isAdmin, setIsAdmin] = useState(false);

            const SHEET_URL = "https://script.google.com/macros/s/AKfycbyKIF-gsKyxHeEhOYsBAWyWx2EuoqjjJ1yyr7oXHEaLUFDUpvcSb2i3Go65WYq4QByBsA/exec";

            useEffect(() => {
                fetch(SHEET_URL)
                    .then(res => res.json())
                    .then(json => {
                        setData({ members: json.members || [], transactions: json.transactions || [] });
                        setLoading(false);
                    });
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.memberId || !formData.amount) return alert("ദയവായി എല്ലാ കോളങ്ങളും പൂരിപ്പിക്കുക");
                
                setLoading(true);
                const payload = {
                    action: 'addTransaction',
                    memberId: formData.memberId,
                    type: formData.type,
                    amount: Number(formData.amount),
                    date: new Date().toISOString()
                };

                try {
                    await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    alert("വിവരങ്ങൾ സേവ് ചെയ്തു!");
                    window.location.reload();
                } catch (err) {
                    alert("Error saving data");
                    setLoading(false);
                }
            };

            const stats = useMemo(() => {
                const totalLoan = data.members.reduce((acc, m) => acc + Number(m.initialLoan || 0), 0);
                const totalInv = data.transactions.reduce((acc, t) => acc + Number(t.investment || 0), 0);
                return { totalLoan, totalInv };
            }, [data]);

            if (loading) return <div className="flex h-screen items-center justify-center font-bold">സിങ്ക് ചെയ്യുന്നു...</div>;

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative">
                    <header className="bg-blue-600 p-6 text-white rounded-b-[2rem] shadow-lg flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-black">അനുപമ</h1>
                            <p className="text-xs font-bold opacity-80 uppercase">{view}</p>
                        </div>
                        {!isAdmin && view === 'transactions' && (
                            <button onClick={() => setIsAdmin(true)} className="bg-white/20 px-3 py-1 rounded-lg text-[10px] font-bold">ADMIN LOGIN</button>
                        )}
                    </header>

                    <main className="flex-1 p-5 pb-24">
                        {view === 'home' && (
                            <div className="space-y-4">
                                <div className="bg-slate-800 p-6 rounded-3xl text-white">
                                    <p className="text-[10px] uppercase font-bold opacity-60">ആകെ ബാക്കി വായ്പ</p>
                                    <p className="text-3xl font-black mt-1">₹{stats.totalLoan.toLocaleString()}</p>
                                </div>
                                <h2 className="font-black text-slate-800 mt-6">അംഗങ്ങളുടെ പട്ടിക</h2>
                                {data.members.map((m, idx) => (
                                    <div key={idx} className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between">
                                        <span className="font-bold">{m.name}</span>
                                        <span className="font-black text-blue-600">₹{m.initialLoan}</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'transactions' && (
                            <div className="space-y-4">
                                <h2 className="font-black text-xl mb-4">പുതിയ ഇടപാടുകൾ</h2>
                                <form onSubmit={handleSubmit} className="space-y-4 bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase">അംഗം</label>
                                        <select 
                                            className="w-full p-3 rounded-xl border mt-1"
                                            onChange={(e) => setFormData({...formData, memberId: e.target.value})}
                                        >
                                            <option value="">തിരഞ്ഞെടുക്കുക</option>
                                            {data.members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase">തരം</label>
                                        <select 
                                            className="w-full p-3 rounded-xl border mt-1"
                                            onChange={(e) => setFormData({...formData, type: e.target.value})}
                                        >
                                            <option value="investment">സമ്പാദ്യം (Investment)</option>
                                            <option value="loanTaken">വായ്പ എടുക്കൽ</option>
                                            <option value="loanRepaid">തിരിച്ചടവ്</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase">തുക (Amount)</label>
                                        <input 
                                            type="number" 
                                            className="w-full p-3 rounded-xl border mt-1" 
                                            placeholder="0.00"
                                            onChange={(e) => setFormData({...formData, amount: e.target.value})}
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold p-4 rounded-xl shadow-lg active:scale-95 transition-transform">
                                        സേവ് ചെയ്യുക
                                    </button>
                                </form>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="space-y-4">
                                <h2 className="font-black text-xl mb-4">റിപ്പോർട്ടുകൾ</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-blue-50 p-5 rounded-3xl border border-blue-100">
                                        <p className="text-[10px] font-bold text-blue-400 uppercase">ആകെ സമ്പാദ്യം</p>
                                        <p className="text-xl font-black text-blue-700">₹{stats.totalInv}</p>
                                    </div>
                                    <div className="bg-emerald-50 p-5 rounded-3xl border border-emerald-100">
                                        <p className="text-[10px] font-bold text-emerald-400 uppercase">പലിശ ലഭിച്ചത്</p>
                                        <p className="text-xl font-black text-emerald-700">₹0</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-4 flex justify-around items-center">
                        <button onClick={() => setView('home')} className={`px-6 py-2 rounded-xl text-[10px] font-bold uppercase ${view === 'home' ? 'nav-active' : 'text-slate-400'}`}>Home</button>
                        <button onClick={() => setView('transactions')} className={`px-6 py-2 rounded-xl text-[10px] font-bold uppercase ${view === 'transactions' ? 'nav-active' : 'text-slate-400'}`}>Entry</button>
                        <button onClick={() => setView('reports')} className={`px-6 py-2 rounded-xl text-[10px] font-bold uppercase ${view === 'reports' ? 'nav-active' : 'text-slate-400'}`}>Report</button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
