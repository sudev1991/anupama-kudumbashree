<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anupama Kudumbashree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background-color: #f8fafc; margin: 0; }
        .nav-active { background-color: #2563eb; color: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column;">
            <div style="border:4px solid #2563eb; border-top:4px solid transparent; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite;"></div>
            <p style="margin-top:16px; font-weight:bold; color:#475569;">സിങ്ക് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [view, setView] = useState('home');
            const [data, setData] = useState({ members: [], transactions: [] });
            const [loading, setLoading] = useState(true);

            const SHEET_URL = "https://script.google.com/macros/s/AKfycbyKIF-gsKyxHeEhOYsBAWyWx2EuoqjjJ1yyr7oXHEaLUFDUpvcSb2i3Go65WYq4QByBsA/exec";

            useEffect(() => {
                fetch(SHEET_URL)
                    .then(res => res.json())
                    .then(json => {
                        setData({ members: json.members || [], transactions: json.transactions || [] });
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Error:", err);
                        setLoading(false);
                    });
            }, []);

            if (loading) return (
                <div className="flex h-screen items-center justify-center flex-col">
                    <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
                    <p className="mt-4 font-bold text-slate-500">Data Fetching...</p>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative">
                    <header className="bg-blue-600 p-6 text-white rounded-b-[2rem] shadow-lg">
                        <h1 className="text-2xl font-black">അനുപമ</h1>
                        <p className="text-xs font-bold opacity-80 uppercase">
                            {view === 'home' ? 'ഡാഷ്‌ബോർഡ്' : (view === 'transactions' ? 'ഇടപാടുകൾ' : 'റിപ്പോർട്ടുകൾ')}
                        </p>
                    </header>

                    <main className="flex-1 p-5 pb-24">
                        {view === 'home' && (
                            <div className="space-y-4">
                                <div className="bg-slate-800 p-5 rounded-3xl text-white">
                                    <p className="text-[10px] uppercase font-bold opacity-60">ആകെ ബാക്കി വായ്പ</p>
                                    <p className="text-3xl font-black mt-1">
                                        ₹{data.members.reduce((acc, m) => acc + Number(m.initialLoan || 0), 0).toLocaleString()}
                                    </p>
                                </div>
                                <h2 className="font-black text-slate-800 px-2 mt-6">അംഗങ്ങൾ</h2>
                                {data.members.map((m, idx) => (
                                    <div key={idx} className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                        <span className="font-bold text-slate-700">{m.name || m.Name}</span>
                                        <span className="font-black text-blue-600">₹{m.initialLoan || m['Initial Loan'] || 0}</span>
                                    </div>
                                ))}
                            </div>
                        )}

                        {view === 'transactions' && (
                            <div className="space-y-4 text-center py-10">
                                <div className="mx-auto w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4">
                                    <i data-lucide="database"></i>
                                </div>
                                <h2 className="font-black text-xl">ഇടപാടുകൾ</h2>
                                <p className="text-slate-500 text-sm">പുതിയ കണക്കുകൾ ചേർക്കാൻ അഡ്മിൻ ലോഗിൻ ചെയ്യുക.</p>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="space-y-4">
                                <h2 className="font-black text-xl mb-4">റിപ്പോർട്ടുകൾ</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                        <p className="text-[10px] font-bold text-slate-400">ഈ മാസത്തെ വരവ്</p>
                                        <p className="text-lg font-black text-blue-600">₹0</p>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                        <p className="text-[10px] font-bold text-slate-400">ആകെ പലിശ</p>
                                        <p className="text-lg font-black text-emerald-600">₹0</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-100 p-4 flex justify-around items-center z-50">
                        <button onClick={() => setView('home')} className={`p-3 rounded-2xl flex flex-col items-center transition-all ${view === 'home' ? 'nav-active' : 'text-slate-400'}`}>
                            <span className="text-[10px] font-bold">Home</span>
                        </button>
                        <button onClick={() => setView('transactions')} className={`p-3 rounded-2xl flex flex-col items-center transition-all ${view === 'transactions' ? 'nav-active' : 'text-slate-400'}`}>
                            <span className="text-[10px] font-bold">Entry</span>
                        </button>
                        <button onClick={() => setView('reports')} className={`p-3 rounded-2xl flex flex-col items-center transition-all ${view === 'reports' ? 'nav-active' : 'text-slate-400'}`}>
                            <span className="text-[10px] font-bold">Report</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
