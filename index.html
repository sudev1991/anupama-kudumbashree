<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>അനുപമ കുടുംബശ്രീ</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons (Replaces Lucide) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (to compile JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbar for a polished look */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // --- INITIAL STATE ---
    const initialMembers = [];
    const initialTransactions = [];

    // Replace this with your actual deployed Google Apps Script URL
    const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbycWgUg46SptpqLktuQz67ouWSdD58RT2k9-y127d2ehMRG3GKV-15atxY6N-rkC1PQ/exec";

    // --- HELPERS ---
    const getTodayString = () => new Date().toISOString().split('T')[0];
    const getCurrentMonthKey = () => getTodayString().substring(0, 7);
    const getWeekOfMonth = (dateStr) => {
      const day = new Date(dateStr).getDate();
      if (day <= 7) return 1;
      if (day <= 14) return 2;
      if (day <= 21) return 3;
      if (day <= 28) return 4;
      return 5;
    };

    const isLateEntry = (date, enteredAt) => {
      if (!date || !enteredAt) return false;
      const tDate = new Date(date);
      const eDate = new Date(enteredAt);
      const diffTime = eDate - tDate;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays > 6;
    };

    const parseDateSafe = (d) => {
      if (!d) return '';
      try { return new Date(d).toISOString().split('T')[0]; } 
      catch(e) { return d; }
    };

    function App() {
      const [authMode, setAuthMode] = useState('guest');
      const [view, setView] = useState('home');
      const [members, setMembers] = useState(initialMembers);
      const [transactions, setTransactions] = useState(initialTransactions);
      const [sheetUrl, setSheetUrl] = useState(DEFAULT_SHEET_URL); 
      const [adminPassword, setAdminPassword] = useState('admin123');
      const [isLoaded, setIsLoaded] = useState(false);
      
      const currentMonthDisplay = useMemo(() => {
        return new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      }, []);

      const [reportMonth, setReportMonth] = useState(getCurrentMonthKey());
      const [syncStatus, setSyncStatus] = useState('idle');
      const skipNextSync = useRef(false);

      useEffect(() => {
        const loadFromSheet = async () => {
          try {
            setSyncStatus('syncing');
            const res = await fetch(sheetUrl);
            const data = await res.json();

            skipNextSync.current = true;

            if (data.members) {
              setMembers(data.members.map(m => ({
                id: String(m.ID || m.id),
                name: m.Name || m.name,
                initialInvestment: Number(m['Initial Investment'] || m.initialInvestment || 0),
                initialLoan: Number(m['Initial Loan'] || m.initialLoan || 0)
              })));
            }

            if (data.transactions) {
              setTransactions(data.transactions.map(t => ({
                id: String(t.ID || t.id),
                memberId: String(t.MemberID || t.memberId),
                date: parseDateSafe(t.Date || t.date),
                enteredAt: parseDateSafe(t.EnteredAt || t.enteredAt || t.Date || t.date),
                investment: Number(t.Investment || t.investment || 0),
                loanTaken: Number(t['Loan Taken'] || t.loanTaken || 0),
                loanRepaid: Number(t['Loan Repaid'] || t.loanRepaid || 0),
                isDeleted: String(t.IsDeleted).toUpperCase() === 'TRUE' || t.isDeleted === true || false,
                deletedAt: t.DeletedAt ? parseDateSafe(t.DeletedAt) : null
              })));
            }

            if (data.settings && data.settings.length > 0) {
              const pass = data.settings.find(s => s.Key === 'adminPassword' || s.Key === 'AdminPassword');
              if (pass) setAdminPassword(pass.Value);
            }

            setSyncStatus('success');
            setTimeout(() => setSyncStatus('idle'), 3000);
          } catch (err) {
            console.error('Fetch error:', err);
            setSyncStatus('error');
            setTimeout(() => setSyncStatus('idle'), 3000);
          } finally {
            setIsLoaded(true);
          }
        };
        loadFromSheet();
      }, [sheetUrl]);

      const syncWithSheet = async () => {
        if (!sheetUrl) return;
        setSyncStatus('syncing');
        try {
          const payload = { action: 'push', members, transactions, settings: { adminPassword } };
          await fetch(sheetUrl, {
            method: 'POST',
            mode: 'no-cors',
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSyncStatus('success');
          setTimeout(() => setSyncStatus('idle'), 3000);
        } catch (e) {
          console.error("Sync Error:", e);
          setSyncStatus('error');
          setTimeout(() => setSyncStatus('idle'), 3000);
        }
      };

      useEffect(() => {
        if (!isLoaded) return;
        if (skipNextSync.current) {
          skipNextSync.current = false;
          return;
        }
        const timer = setTimeout(() => syncWithSheet(), 1500); 
        return () => clearTimeout(timer);
      }, [members, transactions, adminPassword, isLoaded]);

      const dashboardData = useMemo(() => {
        const curMonth = getCurrentMonthKey();
        let totals = { curInvest: 0, cumInvest: 0, curLoanTaken: 0, curLoanRepaid: 0, totalLoanBal: 0 };
        const activeTransactions = transactions.filter(t => !t.isDeleted);

        const memberStats = members.map(m => {
          let stats = {
            name: m.name, id: m.id,
            cumInvest: Number(m.initialInvestment),
            curInvest: 0, curLoanTaken: 0, curLoanRepaid: 0,
            loanBal: Number(m.initialLoan),
            weekly: {
              inv: [0,0,0,0,0], invLate: [false,false,false,false,false],
              lt: [0,0,0,0,0], ltLate: [false,false,false,false,false],
              lr: [0,0,0,0,0], lrLate: [false,false,false,false,false]
            }
          };

          activeTransactions.filter(t => t.memberId === m.id).forEach(t => {
            const isCur = t.date.startsWith(curMonth);
            const late = isLateEntry(t.date, t.enteredAt);
            
            stats.cumInvest += Number(t.investment);
            stats.loanBal += (Number(t.loanTaken) - Number(t.loanRepaid));
            
            if (isCur) {
              stats.curInvest += Number(t.investment);
              stats.curLoanTaken += Number(t.loanTaken);
              stats.curLoanRepaid += Number(t.loanRepaid);
              
              const w = getWeekOfMonth(t.date) - 1;
              stats.weekly.inv[w] += Number(t.investment);
              if (late && Number(t.investment) > 0) stats.weekly.invLate[w] = true;

              stats.weekly.lt[w] += Number(t.loanTaken);
              if (late && Number(t.loanTaken) > 0) stats.weekly.ltLate[w] = true;

              stats.weekly.lr[w] += Number(t.loanRepaid);
              if (late && Number(t.loanRepaid) > 0) stats.weekly.lrLate[w] = true;
            }
          });

          totals.cumInvest += stats.cumInvest;
          totals.curInvest += stats.curInvest;
          totals.curLoanTaken += stats.curLoanTaken;
          totals.curLoanRepaid += stats.curLoanRepaid;
          totals.totalLoanBal += stats.loanBal;
          return stats;
        });

        return { totals, memberStats };
      }, [members, transactions]);

      const navigate = (v) => {
        if ((v === 'master' || v === 'transactions') && authMode !== 'admin') setView('login');
        else setView(v);
      };

      return (
        <div className="min-h-screen bg-slate-100 flex justify-center p-0 sm:p-4 font-sans text-slate-900">
          <div className="w-full max-w-4xl bg-white shadow-2xl flex flex-col h-screen sm:h-[900px] sm:rounded-3xl overflow-hidden relative border border-slate-200">
            <header className="bg-blue-600 text-white p-4 flex justify-between items-center shrink-0 shadow-lg z-20">
              <div className="flex items-center gap-3">
                {view !== 'home' && <button onClick={() => setView('home')} className="p-2 hover:bg-white/10 rounded-full"><i className="fas fa-arrow-left"></i></button>}
                <h1 className="font-black text-xl tracking-tight">അനുപമ കുടുംബശ്രീ</h1>
              </div>
              <div className="flex items-center gap-3">
                {syncStatus === 'syncing' && <i className="fas fa-sync-alt animate-spin text-blue-200" title="Syncing..."></i>}
                {syncStatus === 'success' && <i className="fas fa-check-circle text-emerald-300" title="Saved to Cloud"></i>}
                {syncStatus === 'error' && <i className="fas fa-exclamation-circle text-red-300" title="Sync Failed"></i>}
                
                <button 
                  onClick={() => { if(authMode === 'admin') setAuthMode('guest'); else setView('login'); }}
                  className={`px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 transition-all ${authMode === 'admin' ? 'bg-green-500 hover:bg-green-600' : 'bg-blue-700 hover:bg-blue-800'}`}
                >
                  {authMode === 'admin' ? <><i className="fas fa-unlock"></i> Admin</> : <><i className="fas fa-lock"></i> Login</>}
                </button>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto bg-slate-50 relative p-4">
              {view === 'home' && <HomeView data={dashboardData} month={currentMonthDisplay} onNav={navigate} />}
              {view === 'login' && <LoginView validPass={adminPassword} onLogin={() => { setAuthMode('admin'); setView('home'); }} onCancel={() => setView('home')} />}
              {view === 'master' && (
                <MasterDataView 
                  members={members} setMembers={setMembers} 
                  sheetUrl={sheetUrl} setSheetUrl={setSheetUrl}
                  adminPassword={adminPassword} setAdminPassword={setAdminPassword}
                  syncStatus={syncStatus} forceSync={syncWithSheet}
                />
              )}
              {view === 'transactions' && (
                <TransactionView 
                  members={members} transactions={transactions}
                  onAdd={t => setTransactions(prev => [...prev, t])} 
                  onDelete={id => setTransactions(prev => prev.map(t => t.id === id ? { ...t, isDeleted: true, deletedAt: getTodayString() } : t))}
                  today={getTodayString()} 
                />
              )}
              {view === 'reports' && <ReportsView members={members} transactions={transactions} reportMonth={reportMonth} setReportMonth={setReportMonth} />}
            </main>
          </div>
        </div>
      );
    }

    function HomeView({ data, month, onNav }) {
      const [expandedId, setExpandedId] = useState(null);

      return (
        <div className="space-y-6 pb-6 animate-in fade-in duration-300 max-w-2xl mx-auto">
          <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-6 rounded-[2rem] shadow-xl text-white">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-sm font-bold opacity-80 uppercase tracking-widest">{month} മാസത്തെ വിവരങ്ങൾ</h2>
              <span className="bg-white/20 px-3 py-1 rounded-full text-[10px] font-bold uppercase backdrop-blur-sm">തത്സമയ വിവരങ്ങൾ</span>
            </div>
            <div className="grid grid-cols-2 gap-6 mb-6">
              <StatBox label="ഈ മാസത്തെ സമ്പാദ്യം" value={data.totals.curInvest} />
              <StatBox label="ആകെ സമ്പാദ്യം" value={data.totals.cumInvest} />
              <StatBox label="നൽകിയ വായ്പ (ഈ മാസ)" value={data.totals.curLoanTaken} color="text-amber-300" />
              <StatBox label="തിരിച്ചടവ് (ഈ മാസ)" value={data.totals.curLoanRepaid} color="text-emerald-300" />
            </div>
            <div className="pt-6 border-t border-white/10 flex justify-between items-end">
              <div>
                <p className="text-[10px] opacity-60 uppercase font-bold tracking-wider">ആകെ ബാക്കി വായ്പ</p>
                <span className="text-3xl font-black">₹{data.totals.totalLoanBal.toLocaleString()}</span>
              </div>
              <i className="fas fa-file-alt fa-3x opacity-20"></i>
            </div>
          </div>

          <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
              <h3 className="text-xs font-black text-slate-500 tracking-tighter">നിലവിലെ വിവരങ്ങൾ</h3>
              <span className="text-[9px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">വിവരങ്ങൾക്ക് അംഗത്തിൽ ക്ലിക്ക് ചെയ്യുക</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left">
                <thead className="bg-slate-50 text-slate-400 font-bold border-b border-slate-100">
                  <tr>
                    <th className="p-4">അംഗം</th>
                    <th className="p-4 text-right">സമ്പാദ്യം</th>
                    <th className="p-4 text-right">ബാക്കി വായ്പ</th>
                    <th className="p-4 w-10"></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {data.memberStats.map(m => (
                    <React.Fragment key={m.id}>
                      <tr 
                        onClick={() => setExpandedId(expandedId === m.id ? null : m.id)}
                        className={`cursor-pointer transition-colors ${expandedId === m.id ? 'bg-blue-50/50' : 'hover:bg-slate-50'}`}
                      >
                        <td className="p-4 font-bold text-slate-700">
                          <div className="flex flex-col">
                            <span>{m.name}</span>
                            <span className="text-[9px] text-slate-400 font-normal uppercase">ID: {m.id}</span>
                          </div>
                        </td>
                        <td className="p-4 text-right text-blue-600 font-bold">₹{m.curInvest.toLocaleString()}</td>
                        <td className="p-4 text-right text-slate-900 font-black">₹{m.loanBal.toLocaleString()}</td>
                        <td className="p-4 text-slate-300">
                          <i className={`fas fa-chevron-${expandedId === m.id ? 'up' : 'down'}`}></i>
                        </td>
                      </tr>
                      {expandedId === m.id && (
                        <tr className="bg-slate-50/50 animate-in slide-in-from-top-2">
                          <td colSpan="4" className="p-4 pt-0">
                            <div className="bg-white border border-slate-100 rounded-2xl p-4 shadow-inner space-y-4">
                              <WeeklySubReport title="ആഴ്ചതിരിച്ചുള്ള സമ്പാദ്യം" data={m.weekly.inv} lateData={m.weekly.invLate} color="blue" />
                              <div className="grid grid-cols-2 gap-4">
                                 <WeeklySubReport title="നൽകിയ വായ്പ" data={m.weekly.lt} lateData={m.weekly.ltLate} color="amber" />
                                 <WeeklySubReport title="തിരിച്ചടവ്" data={m.weekly.lr} lateData={m.weekly.lrLate} color="emerald" />
                              </div>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <NavButton icon={<i className="fas fa-database text-blue-600 text-xl"></i>} title="Entry" subtitle="Transactions ചേർക്കുക" onClick={() => onNav('transactions')} />
            <NavButton icon={<i className="fas fa-file-alt text-emerald-600 text-xl"></i>} title="Reports" subtitle="റിപ്പോർട്ടുകൾ കാണാൻ" onClick={() => onNav('reports')} />
            <NavButton icon={<i className="fas fa-user-plus text-purple-600 text-xl"></i>} title="Master" subtitle="അംഗങ്ങളെ ചേർക്കാൻ" onClick={() => onNav('master')} />
          </div>
        </div>
      );
    }

    function WeeklySubReport({ title, data, lateData, color }) {
      const colors = {
        blue: 'text-blue-600 bg-blue-50',
        amber: 'text-amber-600 bg-amber-50',
        emerald: 'text-emerald-600 bg-emerald-50'
      };
      return (
        <div className="space-y-2">
          <h4 className="text-[9px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1">
            <i className="fas fa-calendar-alt"></i> {title}
          </h4>
          <div className="flex gap-1 justify-between">
            {data.map((val, i) => {
              const isLate = lateData[i];
              const colorClass = isLate ? 'text-red-600 bg-red-50' : colors[color];
              
              return (
                <div key={i} className="flex-1 text-center">
                  <p className="text-[8px] text-slate-400 font-bold uppercase mb-1">ആഴ്ച {i+1}</p>
                  <div className={`py-1 rounded-lg text-[10px] font-bold ${val > 0 ? colorClass : 'bg-slate-100 text-slate-400 opacity-40'}`}>
                    ₹{val}
                  </div>
                </div>
              )
            })}
          </div>
        </div>
      );
    }

    function StatBox({ label, value, color = "text-white" }) {
      return (
        <div>
          <p className="text-[10px] opacity-70 mb-1 font-bold">{label}</p>
          <p className={`text-2xl font-black ${color}`}>₹{value.toLocaleString()}</p>
        </div>
      );
    }

    function NavButton({ icon, title, subtitle, onClick }) {
      return (
        <button onClick={onClick} className="bg-white p-5 rounded-3xl flex flex-row sm:flex-col items-center gap-4 shadow-sm border border-slate-200 active:scale-95 transition-all text-left sm:text-center group">
          <div className="p-3 bg-slate-50 rounded-2xl group-hover:bg-blue-50 transition-colors w-12 h-12 flex items-center justify-center">{icon}</div>
          <div><h4 className="font-black text-slate-800 leading-none">{title}</h4><p className="text-[10px] text-slate-400 mt-1 uppercase tracking-widest">{subtitle}</p></div>
        </button>
      );
    }

    function MasterDataView({ members, setMembers, sheetUrl, setSheetUrl, adminPassword, setAdminPassword, syncStatus, forceSync }) {
      const [form, setForm] = useState({ name: '', inv: '', loan: '' });
      const [newPass, setNewPass] = useState('');
      const [confirmDelete, setConfirmDelete] = useState(null);

      const handleAdd = (e) => {
        e.preventDefault();
        if (!form.name) return;
        setMembers([...members, { id: Date.now().toString(), name: form.name, initialInvestment: Number(form.inv) || 0, initialLoan: Number(form.loan) || 0 }]);
        setForm({ name: '', inv: '', loan: '' });
      };

      return (
        <div className="space-y-6 pb-20 animate-in slide-in-from-bottom-4 max-w-2xl mx-auto">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <i className="fas fa-link text-blue-600"></i>
                  <h3 className="font-black text-slate-800 text-xs">Google Sync</h3>
                </div>
              </div>
              <input 
                className="w-full p-3 bg-slate-50 border-none rounded-xl text-[10px] mb-3 font-mono focus:ring-2 ring-blue-100 transition-all text-slate-500" 
                placeholder="Web App URL നൽകുക"
                value={sheetUrl} onChange={e => setSheetUrl(e.target.value)}
              />
              <button 
                disabled={!sheetUrl || syncStatus === 'syncing'}
                onClick={() => forceSync()}
                className={`w-full py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-md ${
                  syncStatus === 'syncing' ? 'bg-slate-200 text-slate-600' : 
                  syncStatus === 'success' ? 'bg-green-500 text-white' : 
                  syncStatus === 'error' ? 'bg-red-500 text-white' : 
                  'bg-slate-900 text-white hover:bg-black'
                }`}
              >
                {syncStatus === 'syncing' ? <i className="fas fa-sync-alt animate-spin"></i> : 
                 syncStatus === 'success' ? <i className="fas fa-check-circle"></i> : 
                 syncStatus === 'error' ? <i className="fas fa-exclamation-circle"></i> : 
                 <i className="fas fa-sync-alt"></i>}
                {syncStatus === 'syncing' ? 'Syncing...' : 
                 syncStatus === 'success' ? 'Data Loaded!' : 
                 syncStatus === 'error' ? 'Sync Failed' : 
                 'Sync From Cloud'}
              </button>
            </div>

            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
              <div className="flex items-center gap-2 mb-4">
                <i className="fas fa-shield-alt text-purple-600"></i>
                <h3 className="font-black text-slate-800 text-xs">പാസ്‌വേഡ് മാറ്റാൻ</h3>
              </div>
              <div className="flex gap-2">
                <input 
                  type="text" className="flex-1 p-3 bg-slate-50 border-none rounded-xl text-xs font-bold" 
                  placeholder="പുതിയ പാസ്‌വേഡ്"
                  value={newPass} onChange={e => setNewPass(e.target.value)}
                />
                <button 
                  onClick={() => { if(newPass) { setAdminPassword(newPass); setNewPass(''); } }}
                  className="px-4 bg-purple-600 text-white rounded-xl font-bold text-xs"
                >സേവ്</button>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
            <h3 className="font-black text-slate-800 mb-4 text-xs">അംഗങ്ങളുടെ വിവരങ്ങൾ</h3>
            <form onSubmit={handleAdd} className="grid grid-cols-1 sm:grid-cols-4 gap-2 mb-6 border-b border-slate-100 pb-6">
              <input className="sm:col-span-2 p-3 bg-slate-50 border-none rounded-xl text-sm font-bold" placeholder="പേര്" required value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
              <input type="number" className="p-3 bg-slate-50 border-none rounded-xl text-sm" placeholder="ആദ്യ സമ്പാദ്യം" value={form.inv} onChange={e => setForm({...form, inv: e.target.value})} />
              <input type="number" className="p-3 bg-slate-50 border-none rounded-xl text-sm" placeholder="ആദ്യ വായ്പ" value={form.loan} onChange={e => setForm({...form, loan: e.target.value})} />
              <button className="sm:col-span-4 bg-blue-600 text-white font-black py-3 rounded-xl text-xs">അംഗത്തെ ചേർക്കുക</button>
            </form>

            <div className="space-y-2">
              {members.map(m => (
                <div key={m.id} className="bg-slate-50 p-4 rounded-2xl flex justify-between items-center group border border-transparent hover:border-slate-200 transition-colors">
                  <div>
                    <p className="font-black text-slate-800">{m.name}</p>
                    <p className="text-[10px] text-slate-500 font-bold mt-1">ID: {m.id} | സമ്പാദ്യം: ₹{m.initialInvestment} | വായ്പ: ₹{m.initialLoan}</p>
                  </div>
                  <button onClick={() => setConfirmDelete(m)} className="p-2 text-slate-300 group-hover:text-red-500 transition-colors"><i className="fas fa-trash-alt"></i></button>
                </div>
              ))}
            </div>
          </div>

          {confirmDelete && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-6 z-50 backdrop-blur-md">
              <div className="bg-white rounded-[3rem] p-8 w-full max-w-sm shadow-2xl">
                <h4 className="font-black text-xl mb-4 text-center text-red-600">ഒഴിവാക്കണമോ?</h4>
                <p className="text-center text-sm font-bold text-slate-600 mb-8"><b>{confirmDelete.name}</b> നെ ഒഴിവാക്കാൻ ആഗ്രഹിക്കുന്നുണ്ടോ?</p>
                <div className="flex gap-3">
                  <button onClick={() => setConfirmDelete(null)} className="flex-1 py-4 bg-slate-100 rounded-2xl font-black text-[10px]">ക്യാൻസൽ</button>
                  <button onClick={() => {
                    setMembers(members.filter(mem => mem.id !== confirmDelete.id));
                    setConfirmDelete(null);
                  }} className="flex-1 py-4 bg-red-600 text-white rounded-2xl font-black text-[10px]">ഒഴിവാക്കുക</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function TransactionView({ members, transactions, onAdd, onDelete, today }) {
      const [form, setForm] = useState({ date: today, memberId: '', inv: '', lTaken: '', lRepaid: '' });
      const [review, setReview] = useState(null);
      const [confirmDeleteTx, setConfirmDeleteTx] = useState(null);
      const [showSearch, setShowSearch] = useState(false);
      const [searchParams, setSearchParams] = useState({ memberId: '', month: '', date: '' });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.memberId) return;
        setReview({ ...form, memberName: members.find(m => m.id === form.memberId)?.name });
      };

      const confirmSave = () => {
        onAdd({ 
          id: Date.now().toString(), 
          memberId: review.memberId, 
          date: review.date, 
          enteredAt: today,
          investment: Number(review.inv) || 0, 
          loanTaken: Number(review.lTaken) || 0, 
          loanRepaid: Number(review.lRepaid) || 0,
          isDeleted: false
        });
        setReview(null);
        setForm({ date: today, memberId: '', inv: '', lTaken: '', lRepaid: '' });
      };

      const filteredTransactions = useMemo(() => {
        let list = transactions.filter(t => !t.isDeleted);
        
        if (showSearch) {
          if (searchParams.memberId) list = list.filter(t => t.memberId === searchParams.memberId);
          if (searchParams.month) list = list.filter(t => t.date.startsWith(searchParams.month));
          if (searchParams.date) list = list.filter(t => t.date === searchParams.date);
          return list.reverse(); 
        }

        return list.slice(-25).reverse();
      }, [transactions, showSearch, searchParams]);

      return (
        <div className="space-y-6 animate-in slide-in-from-right-4 max-w-xl mx-auto pb-20">
          <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
            <h3 className="font-black text-slate-800 mb-6 text-xs">Transaction Entry</h3>
            <form onSubmit={handleSubmit} className="space-y-5">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="text-[10px] font-black text-slate-400">തീയതി</label>
                  <input type="date" required className="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
                </div>
                <div>
                  <label className="text-[10px] font-black text-slate-400">അംഗം</label>
                  <select required className="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold" value={form.memberId} onChange={e => setForm({...form, memberId: e.target.value})}>
                    <option value="">തിരഞ്ഞെടുക്കുക...</option>
                    {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                  </select>
                </div>
              </div>
              <div className="space-y-4">
                <div>
                  <label className="text-[10px] font-black text-slate-400">സമ്പാദ്യം</label>
                  <input type="number" className="w-full p-4 bg-blue-50 rounded-2xl text-lg font-black text-blue-700" placeholder="0" value={form.inv} onChange={e => setForm({...form, inv: e.target.value})} />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-[10px] font-black text-slate-400">നൽകിയ വായ്പ</label>
                    <input type="number" className="w-full p-4 bg-amber-50 rounded-2xl text-lg font-black text-amber-700" placeholder="0" value={form.lTaken} onChange={e => setForm({...form, lTaken: e.target.value})} />
                  </div>
                  <div>
                    <label className="text-[10px] font-black text-slate-400">തിരിച്ചടവ്</label>
                    <input type="number" className="w-full p-4 bg-emerald-50 rounded-2xl text-lg font-black text-emerald-700" placeholder="0" value={form.lRepaid} onChange={e => setForm({...form, lRepaid: e.target.value})} />
                  </div>
                </div>
              </div>
              <button className="w-full bg-blue-600 text-white font-black py-5 rounded-[2rem] shadow-xl hover:bg-blue-700 text-xs tracking-widest uppercase">സേവ് ചെയ്യുക</button>
            </form>
          </div>

          <div className="bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden">
             <div className="flex justify-between items-center mb-6">
                <h3 className="font-black text-slate-800 text-xs flex items-center gap-2">
                   <i className="fas fa-history"></i> {showSearch ? 'തിരച്ചിൽ ഫലം' : 'അടുത്തിടെ ചേർത്ത 25 എണ്ണം'}
                </h3>
                <button 
                  onClick={() => { setShowSearch(!showSearch); setSearchParams({ memberId: '', month: '', date: '' }); }}
                  className={`p-3 rounded-2xl transition-all ${showSearch ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600'}`}
                >
                  {showSearch ? <i className="fas fa-times"></i> : <i className="fas fa-search"></i>}
                </button>
             </div>

             {showSearch && (
               <div className="bg-slate-50 p-4 rounded-3xl mb-6 space-y-3 animate-in fade-in zoom-in-95">
                  <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">ഫിൽട്ടറുകൾ</p>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                     <select 
                        className="p-3 bg-white rounded-xl text-xs font-bold border-none" 
                        value={searchParams.memberId} 
                        onChange={e => setSearchParams({...searchParams, memberId: e.target.value})}
                     >
                        <option value="">എല്ലാ അംഗങ്ങളും</option>
                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                     </select>
                     <input 
                        type="month" className="p-3 bg-white rounded-xl text-xs font-bold border-none" 
                        value={searchParams.month} onChange={e => setSearchParams({...searchParams, month: e.target.value})}
                     />
                     <input 
                        type="date" className="p-3 bg-white rounded-xl text-xs font-bold border-none" 
                        value={searchParams.date} onChange={e => setSearchParams({...searchParams, date: e.target.value})}
                     />
                  </div>
                  {(searchParams.memberId || searchParams.month || searchParams.date) && (
                    <button 
                      onClick={() => setSearchParams({ memberId: '', month: '', date: '' })}
                      className="text-[10px] text-blue-600 font-bold underline"
                    >ക്ലിയർ ചെയ്യുക</button>
                  )}
               </div>
             )}

             <div className="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                {filteredTransactions.map(tx => {
                   const mem = members.find(m => m.id === tx.memberId);
                   const isLate = isLateEntry(tx.date, tx.enteredAt);
                   return (
                     <div key={tx.id} className="bg-slate-50/50 p-4 rounded-2xl flex justify-between items-center group hover:bg-slate-50 border border-slate-100 transition-all">
                        <div>
                           <div className="flex items-center gap-2">
                              <p className="font-black text-slate-800 text-sm">{mem?.name}</p>
                              <span className="text-[10px] bg-white px-2 py-0.5 rounded-full border border-slate-200 text-slate-400 font-bold uppercase tracking-widest">{tx.date}</span>
                           </div>
                           <div className="flex flex-wrap gap-2 mt-2">
                              {tx.investment > 0 && <span className="text-[9px] font-black text-blue-600 px-2 py-1 bg-blue-100 rounded-lg">സമ്പാദ്യം: ₹{tx.investment}</span>}
                              {tx.loanTaken > 0 && <span className="text-[9px] font-black text-amber-600 px-2 py-1 bg-amber-100 rounded-lg">വായ്പ: ₹{tx.loanTaken}</span>}
                              {tx.loanRepaid > 0 && <span className="text-[9px] font-black text-emerald-600 px-2 py-1 bg-emerald-100 rounded-lg">തിരിച്ചടവ്: ₹{tx.loanRepaid}</span>}
                              {isLate && <span className="text-[9px] font-black text-red-600 px-2 py-1 bg-red-100 rounded-lg animate-pulse">LATE</span>}
                           </div>
                        </div>
                        <button onClick={() => setConfirmDeleteTx(tx)} className="p-3 text-slate-300 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all"><i className="fas fa-trash-alt"></i></button>
                     </div>
                   )
                })}
                {filteredTransactions.length === 0 && (
                  <div className="text-center py-10">
                    <p className="text-xs text-slate-400 font-bold italic">വിവരങ്ങൾ ഒന്നും കണ്ടെത്തിയില്ല</p>
                  </div>
                )}
             </div>
          </div>

          {review && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-6 z-50 backdrop-blur-md">
              <div className="bg-white rounded-[3rem] p-8 w-full max-w-sm shadow-2xl">
                <h4 className="font-black text-xl mb-6 text-center">വിവരങ്ങൾ ഉറപ്പാക്കുക</h4>
                <div className="space-y-4 text-xs font-bold text-slate-600 border-y py-6 mb-8">
                  <div className="flex justify-between"><span>അംഗം</span><span>{review.memberName}</span></div>
                  <div className="flex justify-between"><span>തീയതി</span><span>{review.date}</span></div>
                  <div className="flex justify-between text-blue-600"><span>സമ്പാദ്യം</span><span>₹{review.inv || 0}</span></div>
                  <div className="flex justify-between text-amber-600"><span>വായ്പ</span><span>₹{review.lTaken || 0}</span></div>
                  <div className="flex justify-between text-emerald-600"><span>തിരിച്ചടവ്</span><span>₹{review.lRepaid || 0}</span></div>
                </div>
                <div className="flex gap-3">
                  <button onClick={() => setReview(null)} className="flex-1 py-4 bg-slate-100 rounded-2xl font-black text-[10px]">പുറകോട്ട്</button>
                  <button onClick={confirmSave} className="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black text-[10px]">സേവ്</button>
                </div>
              </div>
            </div>
          )}

          {confirmDeleteTx && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-6 z-50 backdrop-blur-md">
              <div className="bg-white rounded-[3rem] p-8 w-full max-w-sm shadow-2xl">
                <h4 className="font-black text-xl mb-4 text-center text-red-600 font-black">ഒഴിവാക്കണമോ?</h4>
                <p className="text-center text-sm font-bold text-slate-600 mb-8">ഈ Transaction എന്നന്നേക്കുമായി ഒഴിവാക്കാൻ ആഗ്രഹിക്കുന്നുണ്ടോ? (ഇത് പിന്നീട് റിപ്പോർട്ടുകളിൽ 'Deleted' ആയി കാണിക്കും)</p>
                <div className="flex gap-3">
                  <button onClick={() => setConfirmDeleteTx(null)} className="flex-1 py-4 bg-slate-100 rounded-2xl font-black text-[10px]">ക്യാൻസൽ</button>
                  <button onClick={() => {
                    onDelete(confirmDeleteTx.id);
                    setConfirmDeleteTx(null);
                  }} className="flex-1 py-4 bg-red-600 text-white rounded-2xl font-black text-[10px]">ഒഴിവാക്കുക</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ReportsView({ members, transactions, reportMonth, setReportMonth }) {
      const [tab, setTab] = useState('main'); 

      const data = useMemo(() => {
        const activeTransactions = transactions.filter(t => !t.isDeleted);
        return members.map((m, idx) => {
          let startInv = Number(m.initialInvestment);
          let startLoan = Number(m.initialLoan);
          
          activeTransactions.filter(t => t.memberId === m.id && t.date < `${reportMonth}-01`).forEach(t => {
            startInv += Number(t.investment);
            startLoan += (Number(t.loanTaken) - Number(t.loanRepaid));
          });

          const monthTrans = activeTransactions.filter(t => t.memberId === m.id && t.date.startsWith(reportMonth));
          const weekly = { 
            inv: [0,0,0,0,0], invLate: [false,false,false,false,false],
            lt: [0,0,0,0,0], ltLate: [false,false,false,false,false],
            lr: [0,0,0,0,0], lrLate: [false,false,false,false,false]
          };

          monthTrans.forEach(t => {
            const w = getWeekOfMonth(t.date) - 1;
            const isLate = isLateEntry(t.date, t.enteredAt);
            weekly.inv[w] += Number(t.investment);
            if(isLate && Number(t.investment) > 0) weekly.invLate[w] = true;
            weekly.lt[w] += Number(t.loanTaken);
            if(isLate && Number(t.loanTaken) > 0) weekly.ltLate[w] = true;
            weekly.lr[w] += Number(t.loanRepaid);
            if(isLate && Number(t.loanRepaid) > 0) weekly.lrLate[w] = true;
          });

          const totalMInv = weekly.inv.reduce((a, b) => a + b, 0);
          const totalMLT = weekly.lt.reduce((a, b) => a + b, 0);
          const totalMLR = weekly.lr.reduce((a, b) => a + b, 0);

          return {
            sn: idx + 1, name: m.name, startInv, weeklyInv: weekly.inv, weeklyInvLate: weekly.invLate, totalMInv,
            cumInv: startInv + totalMInv, startLoan, weeklyLT: weekly.lt, weeklyLTLate: weekly.ltLate, totalMLT,
            weeklyLR: weekly.lr, weeklyLRLate: weekly.lrLate, totalMLR, cumLoan: startLoan + totalMLT - totalMLR
          };
        });
      }, [members, transactions, reportMonth]);

      const deletedTrans = useMemo(() => {
        return transactions.filter(t => t.isDeleted).reverse();
      }, [transactions]);

      return (
        <div className="space-y-4 pb-20 overflow-x-auto">
          <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 sticky left-0 z-10 flex gap-3 items-center justify-between">
            <div className="flex gap-2">
              <button onClick={() => setTab('main')} className={`px-4 py-2 text-xs font-black rounded-xl transition-colors ${tab === 'main' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>റിപ്പോർട്ടുകൾ</button>
              <button onClick={() => setTab('deleted')} className={`px-4 py-2 text-xs font-black rounded-xl transition-colors ${tab === 'deleted' ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>ഒഴിവാക്കിയവ</button>
            </div>
            <div className="flex gap-2">
               {tab === 'main' && <input type="month" className="p-2 bg-slate-50 rounded-xl text-sm font-black border-none" value={reportMonth} onChange={e => setReportMonth(e.target.value)} />}
               <button onClick={() => window.print()} className="p-3 bg-slate-800 text-white rounded-xl shadow-lg"><i className="fas fa-print"></i></button>
            </div>
          </div>

          {tab === 'main' && (
            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden min-w-[1400px]">
              <table className="w-full text-[10px] text-left border-collapse">
                <thead className="bg-slate-900 text-white tracking-tighter">
                  <tr className="divide-x divide-slate-800">
                    <th className="p-3 w-8" rowSpan="2">നം.</th>
                    <th className="p-3 w-40" rowSpan="2">അംഗത്തിന്റെ പേര്</th>
                    <th className="p-3 text-center bg-blue-900" colSpan="8">സമ്പാദ്യം</th>
                    <th className="p-3 text-center bg-amber-900" colSpan="7">നൽകിയ വായ്പ</th>
                    <th className="p-3 text-center bg-emerald-900" colSpan="7">തിരിച്ചടവ്</th>
                  </tr>
                  <tr className="divide-x divide-slate-800 border-t border-slate-800">
                    <th className="p-2 bg-blue-800/50">മാസാദ്യം</th>
                    <th className="p-2">W1</th><th className="p-2">W2</th><th className="p-2">W3</th><th className="p-2">W4</th><th className="p-2">W5</th>
                    <th className="p-2 bg-blue-800/50">ആകെ</th><th className="p-2 bg-blue-950">ആകെ(Cum)</th>
                    <th className="p-2 bg-amber-800/50">മാസാദ്യം</th>
                    <th className="p-2">W1</th><th className="p-2">W2</th><th className="p-2">W3</th><th className="p-2">W4</th><th className="p-2">W5</th>
                    <th className="p-2 bg-amber-800/50">ആകെ</th>
                    <th className="p-2">W1</th><th className="p-2">W2</th><th className="p-2">W3</th><th className="p-2">W4</th><th className="p-2">W5</th>
                    <th className="p-2 bg-emerald-800/50">ആകെ</th><th className="p-2 bg-emerald-950">ബാക്കി</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-medium">
                  {data.map((d, i) => (
                    <tr key={i} className="hover:bg-slate-50 divide-x divide-slate-50">
                      <td className="p-2 text-slate-400">{d.sn}</td>
                      <td className="p-2 font-black text-slate-800 sticky left-0 bg-white shadow-sm">{d.name}</td>
                      <td className="p-2 bg-blue-50 font-bold">₹{d.startInv}</td>
                      {d.weeklyInv.map((v, idx) => <td key={idx} className={`p-2 ${v > 0 ? (d.weeklyInvLate[idx] ? 'text-red-600 font-black bg-red-50' : 'text-blue-600 font-bold') : 'opacity-20'}`}>₹{v}</td>)}
                      <td className="p-2 bg-blue-50 font-black text-blue-700">₹{d.totalMInv}</td>
                      <td className="p-2 bg-blue-100 font-black text-blue-900">₹{d.cumInv}</td>
                      <td className="p-2 bg-amber-50 font-bold">₹{d.startLoan}</td>
                      {d.weeklyLT.map((v, idx) => <td key={idx} className={`p-2 ${v > 0 ? (d.weeklyLTLate[idx] ? 'text-red-600 font-black bg-red-50' : 'text-amber-600 font-bold') : 'opacity-20'}`}>₹{v}</td>)}
                      <td className="p-2 bg-amber-50 font-black text-amber-700">₹{d.totalMLT}</td>
                      {d.weeklyLR.map((v, idx) => <td key={idx} className={`p-2 ${v > 0 ? (d.weeklyLRLate[idx] ? 'text-red-600 font-black bg-red-50' : 'text-emerald-600 font-bold') : 'opacity-20'}`}>₹{v}</td>)}
                      <td className="p-2 bg-emerald-50 font-black text-emerald-700">₹{d.totalMLR}</td>
                      <td className="p-2 bg-slate-900 font-black text-white">₹{d.cumLoan}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {tab === 'deleted' && (
            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
              <table className="w-full text-xs text-left border-collapse">
                <thead className="bg-red-50 text-red-800 font-bold border-b border-red-100">
                  <tr>
                    <th className="p-4">അംഗം</th>
                    <th className="p-4">തീയതി</th>
                    <th className="p-4">ഒഴിവാക്കിയ തീയതി</th>
                    <th className="p-4 text-right">സമ്പാദ്യം</th>
                    <th className="p-4 text-right">നൽകിയ വായ്പ</th>
                    <th className="p-4 text-right">തിരിച്ചടവ്</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {deletedTrans.map(tx => {
                     const mem = members.find(m => m.id === tx.memberId);
                     return (
                       <tr key={tx.id} className="hover:bg-red-50/30 transition-colors">
                         <td className="p-4 font-bold text-slate-800">{mem?.name}</td>
                         <td className="p-4 text-slate-600 font-bold">{tx.date}</td>
                         <td className="p-4 text-red-500 font-bold">{tx.deletedAt || '-'}</td>
                         <td className="p-4 text-right text-blue-600 font-bold">₹{tx.investment}</td>
                         <td className="p-4 text-right text-amber-600 font-bold">₹{tx.loanTaken}</td>
                         <td className="p-4 text-right text-emerald-600 font-bold">₹{tx.loanRepaid}</td>
                       </tr>
                     )
                  })}
                  {deletedTrans.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-slate-400 font-bold">ഒഴിവാക്കിയ വിവരങ്ങൾ ലഭ്യമല്ല</td></tr>}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function LoginView({ validPass, onLogin, onCancel }) {
      const [pass, setPass] = useState('');
      const [err, setErr] = useState('');
      return (
        <div className="h-full flex items-center justify-center">
          <div className="bg-white p-10 rounded-[3rem] shadow-2xl w-full border border-slate-100 text-center max-w-sm">
            <div className="bg-blue-100 text-blue-600 w-20 h-20 rounded-[2.5rem] flex items-center justify-center mx-auto mb-6"><i className="fas fa-lock fa-2x"></i></div>
            <h2 className="text-2xl font-black text-slate-800 mb-8">അഡ്മിൻ ലോഗിൻ</h2>
            <input 
              type="password" autoFocus className="w-full p-5 bg-slate-50 border-none rounded-3xl mb-4 text-center text-2xl font-black tracking-widest outline-none focus:ring-4 ring-blue-50" 
              placeholder="പാസ്‌വേഡ്" value={pass} onChange={e => { setPass(e.target.value); setErr(''); }} 
              onKeyDown={e => e.key === 'Enter' && (pass === validPass ? onLogin() : setErr('തെറ്റായ പാസ്‌വേഡ്'))}
            />
            {err && <p className="text-red-500 text-xs mb-4 font-bold">{err}</p>}
            <button onClick={() => pass === validPass ? onLogin() : setErr('തെറ്റായ പാസ്‌വേഡ്')} className="w-full bg-slate-900 text-white font-black py-5 rounded-[2rem] text-xs mb-4 shadow-xl">ലോഗിൻ</button>
            <button onClick={onCancel} className="w-full text-slate-400 font-black py-2 text-[10px]">ക്യാൻസൽ</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
