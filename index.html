<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>അനുപമ കുടുംബശ്രീ V2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // CONFIGURATION
    const API_URL = "YOUR_NEW_DEPLOY_URL_HERE";

    function App() {
      const [authMode, setAuthMode] = useState('guest');
      const [password, setPassword] = useState('');
      const [view, setView] = useState('home');
      const [members, setMembers] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);
      const [initialLoading, setInitialLoading] = useState(true);

      // --- DATA FETCHING ---
      const fetchData = async () => {
        try {
          const res = await fetch(API_URL);
          const json = await res.json();
          setMembers(json.members.map(m => ({
            id: String(m.id || m.ID), name: m.name || m.Name,
            initialInvestment: Number(m.initialInvestment || 0),
            initialLoan: Number(m.initialLoan || 0)
          })));
          setTransactions(json.transactions.map(t => ({
            id: String(t.id || t.ID), memberId: String(t.memberId || t.MemberID),
            date: t.date.split('T')[0], investment: Number(t.investment || 0),
            loanTaken: Number(t.loanTaken || 0), loanRepaid: Number(t.loanRepaid || 0),
            isDeleted: String(t.isDeleted).toUpperCase() === 'TRUE'
          })));
        } catch (e) { alert("Error loading data. Check internet."); }
        finally { setInitialLoading(false); }
      };

      useEffect(() => { fetchData(); }, []);

      // --- SECURE WRITE OPERATIONS ---
      const securePost = async (action, data) => {
        setIsSyncing(true);
        try {
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors', // Apps Script requires no-cors for simple posts
            body: JSON.stringify({ action, password, data })
          });
          // Refresh local data to ensure accuracy
          setTimeout(fetchData, 1000); 
        } catch (e) {
          alert("Save failed. Check password/connection.");
        } finally {
          setIsSyncing(false);
        }
      };

      const addTransaction = (tx) => {
        setTransactions([...transactions, tx]); // Optimistic UI update
        securePost('addTransaction', tx);
      };

      const deleteTransaction = (id) => {
        setTransactions(transactions.filter(t => t.id !== id));
        securePost('deleteTransaction', { id });
      };

      const addMember = (m) => {
        setMembers([...members, m]);
        securePost('addMember', m);
      };

      // --- CALCULATIONS (Same logic as before) ---
      const dashboardData = useMemo(() => {
        const curMonth = new Date().toISOString().substring(0, 7);
        let totals = { curInvest: 0, cumInvest: 0, curLoanTaken: 0, curLoanRepaid: 0, totalLoanBal: 0 };
        
        const mStats = members.map(m => {
          let stats = { 
            ...m, cumInvest: m.initialInvestment, loanBal: m.initialLoan,
            curInvest: 0, curLoanTaken: 0, curLoanRepaid: 0 
          };
          transactions.filter(t => t.memberId === m.id && !t.isDeleted).forEach(t => {
            stats.cumInvest += t.investment;
            stats.loanBal += (t.loanTaken - t.loanRepaid);
            if(t.date.startsWith(curMonth)) {
              stats.curInvest += t.investment;
              stats.curLoanTaken += t.loanTaken;
              stats.curLoanRepaid += t.loanRepaid;
            }
          });
          totals.cumInvest += stats.cumInvest;
          totals.curInvest += stats.curInvest;
          totals.totalLoanBal += stats.loanBal;
          return stats;
        });
        return { totals, mStats };
      }, [members, transactions]);

      if (initialLoading) return <div className="h-screen flex items-center justify-center font-bold">Loading Data...</div>;

      return (
        <div className="min-h-screen bg-slate-100 flex justify-center p-0 sm:p-4">
          <div className="w-full max-w-4xl bg-white shadow-2xl flex flex-col h-screen sm:h-[900px] sm:rounded-3xl overflow-hidden relative border border-slate-200">
            <header className="bg-indigo-600 text-white p-4 flex justify-between items-center z-20">
              <h1 className="font-black text-xl" onClick={() => setView('home')}>അനുപമ</h1>
              <div className="flex items-center gap-3">
                {isSyncing && <i className="fas fa-spinner animate-spin text-white"></i>}
                <button 
                  onClick={() => { if(authMode === 'admin') { setAuthMode('guest'); setPassword(''); } else setView('login'); }}
                  className={`px-4 py-1.5 rounded-full text-xs font-bold ${authMode === 'admin' ? 'bg-red-500' : 'bg-indigo-800'}`}
                >
                  {authMode === 'admin' ? 'Logout' : 'Admin'}
                </button>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-4 custom-scrollbar">
              {view === 'home' && <HomeView data={dashboardData} setView={setView} />}
              {view === 'login' && <LoginView onLogin={(p) => { setPassword(p); setAuthMode('admin'); setView('home'); }} />}
              {view === 'transactions' && authMode === 'admin' && (
                <TransactionEntry 
                  members={members} 
                  onSave={addTransaction} 
                  onDelete={deleteTransaction}
                  transactions={transactions}
                />
              )}
              {view === 'master' && authMode === 'admin' && (
                <MasterView members={members} onAdd={addMember} />
              )}
            </main>
          </div>
        </div>
      );
    }

    // --- SUB-COMPONENTS (Condensed for brevity, same high-quality UI) ---

    function HomeView({ data, setView }) {
      return (
        <div className="space-y-6 animate-in fade-in">
          <div className="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-[2rem] text-white shadow-xl">
            <div className="grid grid-cols-2 gap-4">
              <div><p className="text-[10px] opacity-70 font-bold uppercase">ആകെ സമ്പാദ്യം</p><p className="text-2xl font-black">₹{data.totals.cumInvest.toLocaleString()}</p></div>
              <div><p className="text-[10px] opacity-70 font-bold uppercase">വായ്പ ബാക്കി</p><p className="text-2xl font-black text-amber-300">₹{data.totals.totalLoanBal.toLocaleString()}</p></div>
            </div>
          </div>
          
          <div className="grid grid-cols-2 gap-3">
             <button onClick={() => setView('transactions')} className="p-6 bg-white border border-slate-200 rounded-3xl text-center shadow-sm">
                <i className="fas fa-plus-circle text-indigo-600 text-2xl mb-2"></i>
                <p className="font-black text-xs">Entry</p>
             </button>
             <button onClick={() => setView('master')} className="p-6 bg-white border border-slate-200 rounded-3xl text-center shadow-sm">
                <i className="fas fa-users text-purple-600 text-2xl mb-2"></i>
                <p className="font-black text-xs">Members</p>
             </button>
          </div>

          <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden">
            <table className="w-full text-xs">
              <thead className="bg-slate-50 text-slate-400"><tr><th className="p-4 text-left">അംഗം</th><th className="p-4 text-right">ബാക്കി</th></tr></thead>
              <tbody className="divide-y">
                {data.mStats.map(m => (
                  <tr key={m.id}><td className="p-4 font-bold">{m.name}</td><td className="p-4 text-right font-black">₹{m.loanBal}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function LoginView({ onLogin }) {
      const [p, setP] = useState('');
      return (
        <div className="h-full flex flex-col items-center justify-center p-6 text-center">
          <h2 className="text-xl font-black mb-4">Password Required</h2>
          <input type="password" value={p} onChange={e => setP(e.target.value)} className="w-full max-w-xs p-4 bg-white border rounded-2xl mb-4 text-center text-xl font-bold" />
          <button onClick={() => onLogin(p)} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold">Login</button>
        </div>
      );
    }

    function TransactionEntry({ members, onSave, onDelete, transactions }) {
      const [form, setForm] = useState({ memberId: '', investment: '', loanTaken: '', loanRepaid: '', date: new Date().toISOString().split('T')[0] });

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
            <h3 className="font-black mb-4">New Entry</h3>
            <div className="space-y-3">
              <select className="w-full p-3 bg-slate-50 rounded-xl" value={form.memberId} onChange={e => setForm({...form, memberId: e.target.value})}>
                <option value="">Select Member</option>
                {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
              <input type="number" placeholder="Investment" className="w-full p-3 bg-blue-50 rounded-xl" value={form.investment} onChange={e => setForm({...form, investment: e.target.value})} />
              <div className="flex gap-2">
                <input type="number" placeholder="Loan Taken" className="flex-1 p-3 bg-amber-50 rounded-xl" value={form.loanTaken} onChange={e => setForm({...form, loanTaken: e.target.value})} />
                <input type="number" placeholder="Repayment" className="flex-1 p-3 bg-emerald-50 rounded-xl" value={form.loanRepaid} onChange={e => setForm({...form, loanRepaid: e.target.value})} />
              </div>
              <button 
                onClick={() => { onSave({...form, id: Date.now().toString(), enteredAt: new Date().toISOString()}); setForm({ memberId: '', investment: '', loanTaken: '', loanRepaid: '', date: new Date().toISOString().split('T')[0] }); }} 
                className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black"
              >Save Transaction</button>
            </div>
          </div>
        </div>
      );
    }

    function MasterView({ members, onAdd }) {
      const [name, setName] = useState('');
      return (
        <div className="space-y-4">
          <div className="p-6 bg-white rounded-3xl border">
            <h3 className="font-black mb-4">Add Member</h3>
            <input value={name} onChange={e => setName(e.target.value)} placeholder="Member Name" className="w-full p-3 bg-slate-50 rounded-xl mb-3" />
            <button onClick={() => { onAdd({id: Date.now().toString(), name, initialInvestment:0, initialLoan:0}); setName(''); }} className="w-full py-3 bg-purple-600 text-white rounded-xl font-bold">Add</button>
          </div>
          <div className="space-y-2">
            {members.map(m => <div key={m.id} className="p-4 bg-white rounded-2xl border font-bold">{m.name} <span className="text-[10px] text-slate-400">ID: {m.id}</span></div>)}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
